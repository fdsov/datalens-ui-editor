name: Statoscope diff analyze

on:
  pull_request:
    branches-ignore:
      - 'weblate-**'

permissions:
  contents: read
  actions: read

jobs:
  statoscope:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: npm ci
      - name: Build
        run: npm run build:analyze && cp ./dist/public/build/stats.json ./input.json
      - name: Download reference stats
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: statoscope_upload_main_stats.yml
          workflow_conclusion: success
          name: main-stats
          path: ./
        continue-on-error: true
      # Fresh forks or expired artifacts may have no saved baseline. Build the PR base
      # instead of silently skipping the size comparison or comparing against itself.
      - name: Check out baseline when no artifact is available
        if: hashFiles('reference.json') == ''
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: statoscope-base
      - name: Build missing baseline
        if: hashFiles('reference.json') == ''
        working-directory: statoscope-base
        run: |
          npm ci
          npm run build:analyze
          cp dist/public/build/stats.json ../reference.json
      - name: Validate
        run: npm run statoscope:validate-diff
      - name: Query stats
        if: "github.event_name == 'pull_request'"
        run: cat ./scripts/ci/statoscope-comment.jora | npx --no-install @statoscope/cli query --input input.json --input reference.json > result.json
      - name: Save result.json and pr
        if: always() && hashFiles('result.json') != ''
        run: |
          mkdir -p ./report/statoscope
          cp result.json ./report/statoscope
          echo "${{ github.event.pull_request.number }}" > ./report/statoscope/report-pr
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('result.json') != ''
        with:
          name: statoscope-report
          path: ./report/statoscope/
          retention-days: 1
          overwrite: true
